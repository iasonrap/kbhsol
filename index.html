<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Follow The Sun — Nordvest</title>
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 1;
    background: rgba(20,20,20,0.85); color: #fff; padding: 12px 16px;
    border-radius: 8px; font-size: 13px; line-height: 1.5; max-width: 260px;
  }
  #panel b { color: #ffd166; }
  #legend { margin-top: 8px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .sun { background: #ffd166; }
  .shade { background: #4a5568; }
  .cloudy { background: #cbd5e0; }
  .night { background: #1a2a6c; }
</style>
</head>
<body>
<div id="panel">Loading sun &amp; weather data…</div>
<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
<script src="app.js"></script>
</body>
</html>
